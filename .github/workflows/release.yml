name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verify Swift & Xcode Version
        run: |
          xcodebuild -version
          swift --version

      - name: Run Test Suite
        run: swift test

      - name: Build and Package DisTask.app
        run: ./build_app.sh --zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: DisTask.zip
          name: DisTask ${{ github.ref_name }}
          generate_release_notes: true
